[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commonapp-connector"
version = "0.1.0"
description = "Claude connector (MCP server) for Common App applicant data exports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "mcp>=2.3,<3", "uvicorn>=0.30"]

[project.optional-dependencies]
sftp = ["paramiko>=3.0"]
dev = ["pytest>=7"]

[project.scripts]
commonapp-connector = "commonapp_connector.cli:main"
commonapp-mcp = "commonapp_connector.server:main"

[tool.setuptools.packages.find]
where = ["src"]
