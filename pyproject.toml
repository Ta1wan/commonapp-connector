[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commonapp-connector"
version = "0.1.0"
description = "Pull Common App applicant data exports into your own systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
sftp = ["paramiko>=3.0"]
dev = ["pytest>=7"]

[project.scripts]
commonapp-connector = "commonapp_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
